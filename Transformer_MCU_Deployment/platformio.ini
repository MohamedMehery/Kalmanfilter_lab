; PlatformIO Project Configuration File
;
; Transformer Predictive-Maintenance — MCU inference firmware.
; Target: Arduino Uno (AVR) — chosen because the exported model is a tiny
; ~10 KB float32 MLP that comfortably fits an ATmega328P (2 KB RAM / 32 KB
; flash), so this also proves the model runs on one of the most
; resource-constrained boards commonly available. The same `src/main.cpp`
; and `model/transformer_fault_model.h` also build unmodified for ESP32 /
; STM32 Blue Pill — just add another [env:...] section below if needed.
;
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
upload_protocol = serial
build_flags =
    -I model
