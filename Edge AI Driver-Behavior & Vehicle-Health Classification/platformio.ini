[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
upload_protocol = serial

; Wokwi GDB debug
debug_tool = custom
debug_port = localhost:9333

; FIX: Disable HAL modules for peripherals not present on F103C8
; and ensure the HAL core header resolves correctly.
build_flags =
    -D HAL_MODULE_ENABLED
    -D HAL_CEC_MODULE_DISABLED
    -D HAL_COMP_MODULE_DISABLED
    -D HAL_CORDIC_MODULE_DISABLED

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor @ ^1.1.14