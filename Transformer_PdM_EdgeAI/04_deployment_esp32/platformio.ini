; Transformer Predictive-Maintenance Edge Node — ESP32
; =====================================================
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      watch the JSON telemetry
;
; The TFLite-Micro port for ESP32 is pulled from GitHub because the registry
; copy lags behind and misses several int8 kernels this model needs.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; TFLite-Micro is C++11-era; silence the noise from its headers so real
    ; warnings in our own code stay visible.
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -Wno-type-limits
    -O2

build_unflags =
    -Os

lib_deps =
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git

; ---------------------------------------------------------------------------
; A larger app partition: the model header alone is ~110 KB of source and the
; TFLM kernels add up.  The default 1.2 MB app slot is fine, but we opt into
; the "huge_app" layout so there is room for OTA-free growth.
board_build.partitions = huge_app.csv


; ---------------------------------------------------------------------------
; Native host build — runs the exact same inference code on your PC.
; Useful to debug feature logic without hardware:
;     pio run -e native_sim
[env:native_sim]
platform = native
build_flags =
    -std=c++17
    -I include
    -D PDM_HOST_SIM=1
build_src_filter = +<sim_main.cpp>
